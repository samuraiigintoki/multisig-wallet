[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned to the compiler that built the Sepolia deployment, so a fresh clone
# reproduces the deployed bytecode exactly.
solc = "0.8.33"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
